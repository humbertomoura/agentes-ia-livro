name: testes

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Verificar manuscrito
        run: |
          test -d manuscrito
          test -n "$(find manuscrito -maxdepth 1 -name 'Agentes_IA*.docx' -print -quit)"

      - name: Verificar sincronização livro-código
        run: python scripts/extrair_codigo.py --check

      - name: Testes gerais
        run: python -m pytest -q

      - name: Testes comerciais
        run: bash tests_comercial_novos.sh
