
name: Validação do livro

on:
  push:
  pull_request:

jobs:
  validar-livro:
    name: Validar exemplos e testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verificar estrutura dos exemplos
        shell: bash
        run: |
          set -euo pipefail

          verificar_exemplo() {
            local pasta="$1"
            local script="$2"

            test -f "comercial/$pasta/$script"
            test -s "comercial/$pasta/saida_esperada.txt"

            echo "OK: $pasta"
          }

          verificar_exemplo \
            parte1_cap08_ar_condicionado rodar.py

          verificar_exemplo \
            parte2_cap15_atendente simulado.py

          verificar_exemplo \
            parte3_cap24_ferramentas demo.py

          verificar_exemplo \
            parte4_cap33_caderno demo.py

          verificar_exemplo \
            parte5_cap42_pasta demo.py

      - name: Executar testes automatizados
        run: python -m pytest -q
