name: validação do livro

on:
  push:
  pull_request:

jobs:
  livro:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Verificar manuscrito
        run: |
          test -d manuscrito
          test -n "$(find manuscrito -maxdepth 1 -name 'Agentes_IA*.docx' -print -quit)"

      - name: Sincronização DOCX ↔ código
        run: python scripts/extrair_codigo.py --check

      - name: Testes da edição comercial
        run: bash tests_comercial_novos.sh
