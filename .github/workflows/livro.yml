name: validação do livro

on:
  push:
  pull_request:

jobs:
  livro:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Verificar manuscrito
        id: manuscrito
        run: |
          if [ -d manuscrito ] && [ -n "$(find manuscrito -maxdepth 1 -name 'Agentes_IA*.docx' -print -quit)" ]; then
            echo "presente=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Manuscrito DOCX ausente; sincronização DOCX ↔ código ignorada."
            echo "presente=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sincronização DOCX ↔ código
        if: steps.manuscrito.outputs.presente == 'true' && hashFiles('scripts/extrair_codigo.py') != ''
        run: python scripts/extrair_codigo.py --check

      - name: Testes da edição comercial
        run: python -m pytest -q
