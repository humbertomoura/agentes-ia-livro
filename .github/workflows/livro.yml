
name: Validação do material do livro

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validar-material:
    name: Verificar arquivos do livro
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Verificar arquivos essenciais
        shell: bash
        run: |
          set -euo pipefail

          arquivos=(
            "README.md"
            "LICENSE"
            "requirements.txt"
            "requirements-dev.txt"
            "tests/test_comercial.py"
          )

          for arquivo in "${arquivos[@]}"; do
            test -s "$arquivo"
            echo "OK: $arquivo"
          done

      - name: Verificar exemplos dos capítulos
        shell: bash
        run: |
          set -euo pipefail

          verificar() {
            local pasta="$1"
            local script="$2"

            test -s "comercial/$pasta/$script"
            test -s "comercial/$pasta/saida_esperada.txt"

            echo "OK: $pasta"
          }

          verificar \
            parte1_cap08_ar_condicionado rodar.py

          verificar \
            parte2_cap15_atendente simulado.py

          verificar \
            parte3_cap24_ferramentas demo.py

          verificar \
            parte4_cap33_caderno demo.py

          verificar \
            parte5_cap42_pasta demo.py

      - name: Verificar integração opcional com LLM
        run: |
          test -s comercial/parte2_cap15_atendente/real.py
          test -s comercial/parte2_cap15_atendente/ferramentas.py

      - name: Validação concluída
        run: echo "Material complementar íntegro."
